<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Planning Quiz</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:20px;
max-width:1000px;
margin:auto;
}

h1{
text-align:center;
}

.question{
background:white;
padding:15px;
margin:15px 0;
border-radius:10px;
box-shadow:0 0 5px rgba(0,0,0,.1);
}

button{
padding:12px 20px;
font-size:16px;
cursor:pointer;
border:none;
background:#007bff;
color:white;
border-radius:8px;
}

.correct{
color:green;
font-weight:bold;
}

.wrong{
color:red;
font-weight:bold;
}

#result{
margin-top:30px;
background:white;
padding:20px;
border-radius:10px;
}
</style>
</head>

<body>

<h1>Introduction to Urban Planning Quiz</h1>

<div id="quiz"></div>

<center>
<button onclick="submitQuiz()">Submit Quiz</button>
</center>

<div id="result"></div>

<script src="questions.js"></script>

<script>

const quiz=document.getElementById("quiz");

questions.forEach((q,index)=>{

let html=`
<div class="question">
<p><b>${index+1}. ${q.question}</b></p>
`;

q.options.forEach(option=>{
html+=`
<label>
<input type="radio"
name="q${index}"
value="${option}">
${option}
</label><br>
`;
});

html+=`</div>`;
quiz.innerHTML+=html;
});

function submitQuiz(){

let score=0;
let output="<h2>Results</h2>";

questions.forEach((q,index)=>{

let selected=document.querySelector(`input[name="q${index}"]:checked`);

if(selected){

if(selected.value===q.answer){
score++;
output+=`<p class="correct">Q${index+1}: Correct</p>`;
}else{
output+=`
<p class="wrong">
Q${index+1}: Wrong<br>
Correct Answer: ${q.answer}
</p>`;
}
}
else{
output+=`
<p class="wrong">
Q${index+1}: Not Answered<br>
Correct Answer: ${q.answer}
</p>`;
}
});

output=`
<h2>Score: ${score}/${questions.length}</h2>
<h3>${((score/questions.length)*100).toFixed(2)}%</h3>
<hr>
`+output;

document.getElementById("result").innerHTML=output;

window.scrollTo(0,document.body.scrollHeight);

}

</script>

</body>
</html>
